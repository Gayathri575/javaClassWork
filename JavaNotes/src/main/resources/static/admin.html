<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | JavaHub</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="css/common.css">

</head>
<body>
<h1>Admin Panel - Add New Note</h1>

<form id="noteForm">
    <label>Title:</label><br>
    <input type="text" id="title" required><br><br>

    <label>Category:</label><br>
    <select id="category" required>
        <option value="Core Java">Core Java</option>
        <option value="Spring Boot">Spring Boot</option>
        <option value="Spring Security">Spring Security</option>
        <option value="Hibernate / JPA">Hibernate / JPA</option>
        <option value="DSA">DSA</option>
        <option value="MySQL">MySQL</option>
    </select><br><br>

    <label>Content (HTML allowed):</label><br>
    <textarea id="content" rows="6" required></textarea><br><br>

    <button type="submit">Add Note</button>
</form>

<div id="message"></div>

<script src="js/admin.js"></script>
<script src="js/common.js"></script>
</body>
</html>
