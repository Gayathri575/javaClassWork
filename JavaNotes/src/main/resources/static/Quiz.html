<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz | JavaHub</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f4f6f9;
          margin: 0;
          padding: 0;
        }

        .container {
          width: 90%;
          max-width: 900px;
          margin: 40px auto;
        }

        h1 {
          text-align: center;
          color: #333;
        }

        .section {
          background: #fff;
          border-radius: 12px;
          padding: 25px;
          margin: 20px 0;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section h2 {
          margin-bottom: 10px;
          color: #444;
        }

        .section p {
          color: #666;
          margin-bottom: 20px;
        }

        .btn {
          display: inline-block;
          padding: 10px 18px;
          margin: 5px;
          border: none;
          border-radius: 8px;
          background: #007bff;
          color: white;
          cursor: pointer;
          text-decoration: none;
          font-size: 14px;
        }

        .btn:hover {
          background: #0056b3;
        }

        .topics {
          margin-top: 10px;
        }

        .topics button {
          background: #28a745;
        }

        .topics button:hover {
          background: #1e7e34;
        }

        .mock {
          background: #ff9800;
        }

        .mock:hover {
          background: #e68900;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Quiz Section</h1>

    <!-- Test Yourself -->
    <div class="section">
        <h2>🧠 Test Yourself</h2>
        <p>Select a topic and practice your knowledge.</p>

        <div class="topics">
            <button class="btn" onclick="startQuiz('core-java')">Core Java</button>
            <button class="btn" onclick="startQuiz('hibernate')">Hibernate</button>
            <button class="btn" onclick="startQuiz('springboot')">Spring Boot</button>
            <button class="btn" onclick="startQuiz('mysql')">MySQL</button>
        </div>
    </div>

    <!-- Mock Interview -->
    <div class="section">
        <h2>🎯 Mock Interview</h2>
        <p>Attempt a mixed quiz from all topics. Just like real interview!</p>

        <button class="btn mock" onclick="startMock()">Start Mock Test</button>
    </div>
</div>

<script>
    function startQuiz(topic) {
      // redirect to quiz page with topic
      window.location.href = "quiz-player.html?topic=" + topic;
    }

    function startMock() {
      // redirect to mixed quiz
      window.location.href = "quiz-player.html?topic=all";
    }
</script>

</body>
</html>
